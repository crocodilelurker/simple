services:
  fastapi-service:
    build: ./fastapi-service
    networks:
      - internal

  express-service:
    build: ./express-service
    networks:
      - internal

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      AI_SERVICE_URL: http://fastapi-service:8000
      BASE_SERVICE_URL: http://express-service:8000
    depends_on:
      - fastapi-service
      - express-service
    networks:
      - internal

networks:
  internal:
    driver: bridge
